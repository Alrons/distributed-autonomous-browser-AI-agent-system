<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="stopped">
  <header class="header">
    <div class="logo">🤖</div>
    <div class="titles">
      <h1>AI Agent Hands</h1>
      <p>Управление браузером через ИИ</p>
    </div>
  </header>

  <section class="status-card">
    <div class="orb">
      <span class="ring"></span>
      <span class="ring ring-2"></span>
      <span class="dot" id="icon">⏻</span>
    </div>
    <div class="status-text">
      <div class="status-title" id="statusTitle">Остановлен</div>
      <div class="status-sub" id="statusSub">Нажмите «Запустить»</div>
    </div>
  </section>

  <section class="stats">
    <div class="stat">
      <span class="stat-label">Связь</span>
      <span class="stat-value" id="lastSync">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Команд</span>
      <span class="stat-value" id="commands">0</span>
    </div>
    <div class="stat stat-wide">
      <span class="stat-label">Сайт</span>
      <span class="stat-value" id="site">—</span>
    </div>
  </section>

  <button id="btnToggle" class="toggle">Запустить агента</button>

  <script src="popup.js"></script>
</body>
</html>
